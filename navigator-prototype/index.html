<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Youth Services Navigator | Koforidua</title>
<style>
:root{--ink:#172b3a;--muted:#71808c;--line:#e5eaee;--bg:#f5f7f8;--white:#fff;--navy:#102f43;--teal:#087e79;--teal2:#e8f5f3;--gold:#d99a35;--blue:#eaf1f8;--red:#b94d4d;--shadow:0 10px 30px rgba(20,45,60,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:68px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.3px}.brandmark{width:36px;height:36px;border-radius:11px;background:var(--teal);display:grid;place-items:center;color:white;font-size:18px}.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}.top-actions{display:flex;align-items:center;gap:12px}.switcher{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink);font-weight:650}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:#f1f4f6;color:#53616c;font-size:11px;font-weight:700}.demo{background:#fff4df;color:#8b5b13}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 68px)}.sidebar{background:var(--navy);color:#d6e2e8;padding:25px 15px;display:flex;flex-direction:column;gap:22px}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#8fa7b4;padding:0 12px;font-weight:750}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c3d3db;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center;font-weight:550}.nav button.active,.nav button:hover{background:#21495b;color:#fff}.nav .ico{width:18px;text-align:center;font-size:16px}.side-note{margin-top:auto;border:1px solid #34586a;background:#173d50;border-radius:12px;padding:13px;font-size:12px;color:#d3e0e6}.side-note strong{display:block;color:#fff;margin-bottom:4px}.main{padding:30px clamp(18px,3vw,42px) 60px;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;color:var(--teal);text-transform:uppercase;letter-spacing:1.1px;font-weight:800}.h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:5px 0 6px}.sub{color:var(--muted);margin:0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px}.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:#066b67}.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-quiet{background:transparent;color:var(--teal);padding:7px}.btn-danger{background:#fff0f0;color:var(--red)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel,.card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(20,45,60,.02)}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:31px;height:31px;border-radius:9px;background:var(--teal2);display:grid;place-items:center;color:var(--teal)}.stat-num{font-size:27px;font-weight:800;letter-spacing:-1px;margin:9px 0 2px}.stat-foot{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.35fr 1fr}.panel{padding:19px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h3{font-size:15px;margin:0;letter-spacing:-.2px}.muted{color:var(--muted)}.small{font-size:12px}.hero{background:linear-gradient(115deg,#10384b,#0a716e);border-radius:18px;padding:28px;color:#fff;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;overflow:hidden;position:relative;margin-bottom:20px}.hero h2{font-size:28px;line-height:1.2;letter-spacing:-.7px;margin:8px 0 10px;max-width:520px}.hero p{color:#d2e8e7;max-width:520px;margin:0 0 18px}.hero .btn{background:#fff;color:#0b5e5b}.hero-frame{width:100%;height:230px;border-radius:14px;overflow:hidden;border:3px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:heroIn .9s ease-out both,heroFloat 7s ease-in-out 1s infinite}
.hero-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%;transform-origin:60% 40%;animation:heroZoom 16s ease-in-out infinite alternate}
@keyframes heroIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes heroZoom{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,1%)}}
@media (prefers-reduced-motion:reduce){.hero-frame,.hero-photo{animation:none}}.hero-art{display:flex;align-items:center;justify-content:center;min-height:150px}.hero-circle{width:165px;height:165px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:65px;box-shadow:0 0 0 22px rgba(255,255,255,.04)}.searchbar{display:flex;gap:9px;margin:17px 0}.searchbox{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 13px;flex:1}.searchbox input{border:0;outline:0;padding:12px 0;width:100%;background:transparent}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:#53616c;font-size:12px;font-weight:650}.filter.active{background:var(--teal2);border-color:#a8d7d1;color:#066b67}.op-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.op-card{padding:17px;display:flex;flex-direction:column;gap:10px;min-height:220px}.op-type{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);font-weight:800}.op-card h3{margin:0;font-size:16px;line-height:1.3}.op-card p{margin:0;color:var(--muted);font-size:12px}.op-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}.tag{background:#f1f4f6;color:#5c6a74;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:650}.card-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-top:4px}.link{border:0;background:transparent;color:var(--teal);font-weight:750;padding:4px}.chat-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:16px}.chatbox{height:490px;display:flex;flex-direction:column}.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}.avatar{width:36px;height:36px;border-radius:12px;background:var(--teal2);color:var(--teal);display:grid;place-items:center;font-weight:800}.chat-messages{flex:1;overflow:auto;padding:18px 4px;display:flex;flex-direction:column;gap:12px}.msg{max-width:83%;padding:11px 13px;border-radius:12px;font-size:13px;white-space:pre-wrap}.msg.bot{background:#f1f5f6;align-self:flex-start;border-bottom-left-radius:3px}.msg.user{background:#e4f3f0;align-self:flex-end;border-bottom-right-radius:3px}.source{font-size:10px;color:#63747e;margin-top:6px}.chat-input{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:13px}.chat-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:11px;outline:0}.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.suggestions button{background:white;border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:11px;color:#53616c}.notice{background:#fff8e9;border:1px solid #f1dfb9;color:#795a27;padding:12px;border-radius:10px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{text-align:left;color:#82909a;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px 9px;border-bottom:1px solid var(--line)}.table td{padding:13px 9px;border-bottom:1px solid #edf0f2;font-size:12px}.table tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:9px}.initials{width:30px;height:30px;border-radius:9px;background:#e9f1f4;display:grid;place-items:center;font-size:10px;font-weight:800;color:#426171}.status{border-radius:999px;padding:5px 8px;font-size:10px;font-weight:750;display:inline-block;background:#eef2f4;color:#56636d}.status.new{background:#eaf1fb;color:#416b9d}.status.review{background:#fff4df;color:#966619}.status.complete{background:#e7f5ed;color:#2d8054}.status.rejected{background:#fff0f0;color:#b94d4d}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;outline:0;color:var(--ink)}.toolbar input{min-width:200px;flex:1}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;font-weight:750;color:#53616c}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:rgba(9,29,40,.48);z-index:50;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:16px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#f1f4f6;border-radius:8px;width:30px;height:30px}.detail-title{font-size:22px;margin:7px 0}.detail-block{padding:13px 0;border-top:1px solid var(--line)}.detail-block h4{margin:0 0 5px;font-size:12px}.detail-block p{margin:0;color:#62717c;font-size:13px}.barrow{display:grid;grid-template-columns:110px 1fr 35px;align-items:center;gap:9px;margin:12px 0;font-size:11px}.bar{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal);border-radius:99px}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#173d50;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;animation:up .2s ease}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.footer-note{margin-top:22px;color:#8a969e;font-size:10px}.mobile-menu{display:none}
@media(max-width:1050px){.op-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:760px){.topbar{padding:0 14px}.layout{grid-template-columns:1fr}.sidebar{padding:9px 12px;position:sticky;top:68px;z-index:15;flex-direction:row;overflow:auto;gap:7px}.side-label,.side-note{display:none}.nav{display:flex;gap:5px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.nav .ico{display:none}.main{padding:22px 14px 45px}.hero{grid-template-columns:1fr;padding:22px}.hero-art{display:none}.hero h2{font-size:24px}.op-grid,.chat-layout{grid-template-columns:1fr}.page-head{align-items:flex-start}.page-head .btn{font-size:11px;padding:9px}.h1{font-size:24px}.chatbox{height:430px}.top-actions .demo{display:none}}
@media(max-width:480px){.stats{gap:9px}.stat{padding:12px}.stat-num{font-size:23px}.op-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.brand small{display:none}.switcher{font-size:11px;padding:7px 8px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand"><div class="brandmark">Y</div><div>Youth Services Navigator<small>New Juaben South Municipality · Koforidua</small></div></div>
  <div class="top-actions"><span class="pill demo">DEMO ENVIRONMENT</span><select class="switcher" id="roleSwitch" aria-label="Switch workspace"><option value="youth">Youth portal</option><option value="officer">Municipal officer</option><option value="executive">Executive view</option></select></div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
</div>
<script>
const state={role:'youth',page:'home',filter:'All',search:'',selected:null,referrals:[
{id:'YSN-0024',name:'Akosua Mensah',age:23,phone:'024 *** 1842',opportunity:'Women in Digital Skills',department:'Business Advisory Centre',date:'26 Nov 2026',status:'Under review',note:'Interested in the next training cohort.'},
{id:'YSN-0023',name:'Kwame Boateng',age:27,phone:'055 *** 2901',opportunity:'Youth Enterprise Support',department:'Business Advisory Centre',date:'25 Nov 2026',status:'New',note:'Needs guidance on business plan requirements.'},
{id:'YSN-0022',name:'Abena Owusu',age:21,phone:'020 *** 6631',opportunity:'National Apprenticeship Programme',department:'Youth Services Desk',date:'24 Nov 2026',status:'Contacted',note:'Asked about tailoring placements.'}
],opportunities:[
{id:'OP-001',title:'Women in Digital Skills',type:'Skills training',provider:'Municipal / partner programme',category:'Skills',location:'Koforidua',deadline:'15 Dec 2026',status:'Open',description:'Introductory digital skills training for young women interested in building confidence with everyday digital tools and exploring entry-level digital work.',eligibility:'Young women aged 18–35 living in New Juaben South Municipality. Basic reading ability is helpful but not required for the help-point route.',requirements:'Name and contact details for referral. Final enrolment requirements are confirmed by the programme provider.',contact:'NJSMA Business Advisory Centre',demo:true},
{id:'OP-002',title:'Youth Enterprise Support',type:'Enterprise support',provider:'Business Advisory Centre',category:'Business',location:'Koforidua',deadline:'20 Dec 2026',status:'Open',description:'Guidance for young people developing a small business idea, including business planning, advisory support and information on available enterprise schemes.',eligibility:'Young people aged 18–35 with an early-stage or existing business idea. Funding is not guaranteed.',requirements:'Short description of the business idea and contact details. The provider confirms any additional documents.',contact:'NJSMA Business Advisory Centre',demo:true},
{id:'OP-003',title:'National Apprenticeship Programme',type:'Apprenticeship',provider:'National programme · referral destination',category:'Apprenticeship',location:'Eastern Region',deadline:'Check with provider',status:'Open',description:'Information and referral guidance for structured apprenticeship pathways in selected trades. Availability depends on current intake and participating training providers.',eligibility:'Eligibility and trade availability must be confirmed with the programme administrator.',requirements:'Contact details and preferred trade for an initial enquiry. Do not submit original documents through this demo.',contact:'National programme contact',demo:true},
{id:'OP-004',title:'Start-up Kit Information Desk',type:'Business support',provider:'New Juaben South Municipal Assembly',category:'Business',location:'NJSMA service area',deadline:'Intake to be confirmed',status:'Verification needed',description:'Information desk for municipal start-up support and any current application window. The Assembly must confirm availability, selection criteria and application dates.',eligibility:'To be confirmed by the responsible NJSMA department. This listing is not an announcement of an open grant.',requirements:'Ask the officer for the current programme notice and requirements.',contact:'NJSMA Business Advisory Centre',demo:true},
{id:'OP-005',title:'Skills Training for Persons with Disabilities',type:'Skills training',provider:'Municipal / partner programme',category:'Inclusion',location:'Koforidua',deadline:'Check with provider',status:'Verification needed',description:'A signposting entry for skills training options and accessibility support for young people with disabilities. Specific providers and available places require confirmation.',eligibility:'Young people with disabilities aged 18–35. Reasonable accommodation should be discussed with the provider.',requirements:'No medical documents should be uploaded through this prototype. An officer can explain any legitimate requirements.',contact:'NJSMA Social Welfare and Community Development',demo:true},
{id:'OP-006',title:'Youth Employment Agency Services',type:'Employment support',provider:'National agency · referral destination',category:'Jobs',location:'Eastern Region',deadline:'Check agency portal',status:'Open',description:'Information and signposting to employment support, skills and placement services administered by the Youth Employment Agency. Current openings vary.',eligibility:'Depends on the specific scheme and current intake. The agency makes all eligibility decisions.',requirements:'Check the current scheme notice and official application route.',contact:'Youth Employment Agency',demo:true}
],language:'English'};
const youthNav=[['home','⌂','Discover opportunities'],['assistant','✦','AI assistant'],['referrals','▤','My referrals'],['help','?','Help & access']];
const adminNav=[['overview','▦','Overview'],['opportunities','◇','Opportunity catalogue'],['referrals','▤','Referrals'],['insights','▥','Youth insights'],['accountability','◎','Accountability'],['settings','⚙','Settings & audit']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function setPage(p){state.page=p;state.selected=null;render()}
function setRole(r){state.role=r;state.page=r==='youth'?'home':'overview';state.selected=null;document.getElementById('roleSwitch').value=r;render()}
function render(){const isYouth=state.role==='youth';const nav=isYouth?youthNav:adminNav;document.getElementById('sidebar').innerHTML=`<div class="side-label">${isYouth?'Explore':'Municipal workspace'}</div><div class="nav">${nav.map(([id,ic,label])=>`<button class="${state.page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${ic}</span>${label}</button>`).join('')}</div><div class="side-note"><strong>${isYouth?'Need a person to help?':'Demonstration workspace'}</strong>${isYouth?'Visit a municipal help point for in-person guidance. You do not need to use the AI assistant.':'Sample records only. Connect verified NJSMA data before public launch.'}</div>`;
const main=document.getElementById('main');if(state.role==='youth')main.innerHTML= youthPage();else if(state.role==='officer')main.innerHTML=officerPage();else main.innerHTML=executivePage();}
function pageHead(kicker,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1 class="h1">${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function stat(label,num,foot,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`}
function opportunityCard(o){return `<article class="card op-card"><div class="op-type">${esc(o.type)} · ${esc(o.provider)}</div><h3>${esc(o.title)}</h3><p>${esc(o.description.slice(0,120))}${o.description.length>120?'…':''}</p><div class="op-meta"><span class="tag">${esc(o.location)}</span><span class="tag">${esc(o.status)}</span><span class="tag">${esc(o.deadline)}</span></div><div class="card-actions"><span class="small muted">${esc(o.category)}</span><button class="link" onclick="showOpportunity('${o.id}')">View details →</button></div></article>`}
function youthPage(){if(state.page==='home')return youthHome();if(state.page==='assistant')return assistantPage();if(state.page==='referrals')return youthReferrals();return helpPage()}
function youthHome(){let q=state.search.toLowerCase();let list=state.opportunities.filter(o=>(state.filter==='All'||o.category===state.filter)&&(!q||(o.title+' '+o.description+' '+o.type+' '+o.provider).toLowerCase().includes(q)));return `${pageHead('YOUTH SERVICES · KOFORIDUA','Find your next opportunity','Explore verified information about jobs, skills training and enterprise support.')}<section class="hero"><div><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">YOUR NEXT STEP STARTS HERE</span><h2>Find opportunities. Get clear guidance. Move forward.</h2><p>Discover services available to young people in New Juaben South. Ask a question or explore opportunities at your own pace.</p><button class="btn" onclick="setPage('assistant')">Ask the AI assistant <span>→</span></button></div><div class="hero-art"><div class="hero-frame"><img class="hero-photo" src="images/hero.jpg" alt="Young people in Koforidua looking at a laptop together"></div></div></section><div class="panel" style="margin-bottom:17px"><div class="panel-head"><div><h3>Explore opportunities</h3><div class="small muted">Search jobs, training, apprenticeships and business support.</div></div><span class="pill">${list.length} listings</span></div><div class="searchbar"><div class="searchbox"><span>⌕</span><input id="oppSearch" placeholder="What are you looking for? e.g. tailoring training" value="${esc(state.search)}" oninput="state.search=this.value;renderOpportunityResults()" /></div><button class="btn btn-primary" onclick="setPage('assistant')">Ask instead</button></div><div class="filters">${['All','Skills','Jobs','Business','Apprenticeship','Inclusion'].map(f=>`<button class="filter ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div><div class="grid op-grid" id="opResults">${list.length?list.map(opportunityCard).join(''):'<div class="empty">No matching listings. Try another search or ask the assistant.</div>'}</div></div><div class="notice">Information in this prototype is for demonstration. Confirm current availability, deadlines and eligibility with the named provider before applying.</div><div class="footer-note">Youth Services Navigator · New Juaben South Municipality · Demonstration prototype</div>`}
function renderOpportunityResults(){const el=document.getElementById('opResults');if(!el)return;let q=state.search.toLowerCase();let list=state.opportunities.filter(o=>(state.filter==='All'||o.category===state.filter)&&(!q||(o.title+' '+o.description+' '+o.type+' '+o.provider).toLowerCase().includes(q)));el.innerHTML=list.length?list.map(opportunityCard).join(''):'<div class="empty">No matching listings. Try another search or ask the assistant.</div>'}
function assistantPage(){return `${pageHead('AI-POWERED GUIDANCE','Ask the Youth Assistant','Describe what you need in everyday language. The assistant searches the demonstration catalogue.')}<div class="chat-layout"><div class="panel chatbox"><div class="chat-head"><div class="avatar">✦</div><div><strong>Youth Services Assistant</strong><div class="small muted">${state.language} · Catalogue-grounded demo</div></div><span class="pill" style="margin-left:auto">Demo AI</span></div><div class="chat-messages" id="messages"><div class="msg bot">Hello! I can help you find jobs, skills training, apprenticeships and business support in New Juaben South. What would you like to explore?<div class="source">I use the sample opportunity catalogue in this prototype.</div></div></div><div class="chat-input"><input id="chatInput" placeholder="Ask about an opportunity…" onkeydown="if(event.key==='Enter')sendChat()"/><button class="btn btn-primary" onclick="sendChat()">Send</button></div><div class="suggestions"><button onclick="quickAsk('I want to learn digital skills')">I want digital skills</button><button onclick="quickAsk('I need support for my small business')">Business support</button><button onclick="quickAsk('I am looking for an apprenticeship')">Find an apprenticeship</button></div></div><div class="panel"><h3 style="margin:0 0 12px">What the assistant can do</h3><div class="detail-block"><h4>Find relevant services</h4><p>Search the opportunity catalogue using everyday questions.</p></div><div class="detail-block"><h4>Explain requirements</h4><p>Summarise published criteria and next steps. It cannot decide eligibility.</p></div><div class="detail-block"><h4>Help with a referral</h4><p>Start a referral only after you choose a listing and give consent.</p></div><div class="detail-block"><h4>Hand over when unsure</h4><p>Direct you to the responsible department when information is missing or needs confirmation.</p></div><div class="notice" style="margin-top:15px">Twi is shown as a planned language option. This demo does not yet validate Twi understanding, translation or speech.</div><div class="field" style="margin-top:15px"><label>DEMO LANGUAGE</label><select onchange="state.language=this.value;render()"><option ${state.language==='English'?'selected':''}>English</option><option ${state.language==='Asante Twi'?'selected':''}>Asante Twi (planned)</option></select></div></div></div>`}
function quickAsk(q){document.getElementById('chatInput').value=q;sendChat()}
function sendChat(){const input=document.getElementById('chatInput');if(!input||!input.value.trim())return;const q=input.value.trim();const box=document.getElementById('messages');box.innerHTML+=`<div class="msg user">${esc(q)}</div>`;input.value='';let terms=q.toLowerCase();let matches=state.opportunities.filter(o=>{let t=(o.title+' '+o.type+' '+o.category+' '+o.description).toLowerCase();return terms.split(/\W+/).filter(x=>x.length>3).some(x=>t.includes(x))});if(!matches.length){if(/job|work|employment/.test(terms))matches=state.opportunities.filter(o=>['Jobs','Apprenticeship'].includes(o.category));else if(/train|learn|skill|course/.test(terms))matches=state.opportunities.filter(o=>['Skills','Apprenticeship'].includes(o.category));else if(/business|capital|startup|start-up/.test(terms))matches=state.opportunities.filter(o=>o.category==='Business')}
let answer;if(matches.length){answer='I found a few listings that may be relevant. Please check the provider and confirm current availability before taking the next step:\n\n'+matches.slice(0,3).map(o=>'• '+o.title+' — '+o.location+'. '+o.description.slice(0,125)+(o.description.length>125?'…':'')).join('\n\n')+'\n\nWould you like to open one of these listings and request a referral?';}else answer='I could not find a clear match in the current catalogue. I do not want to guess or invent a programme. Try describing the type of support you need, or visit the NJSMA help point so a person can assist you.';setTimeout(()=>{box.innerHTML+=`<div class="msg bot">${esc(answer)}<div class="source">Source: Youth Services Navigator demonstration catalogue. Listing status and details require provider confirmation.</div></div>`;box.scrollTop=box.scrollHeight},250);box.scrollTop=box.scrollHeight}
function youthReferrals(){return `${pageHead('YOUR ACTIVITY','My referrals','Track requests you have submitted to municipal service teams.')}<div class="panel"><div class="panel-head"><h3>Referral history</h3><span class="pill">Demo records</span></div>${state.referrals.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Opportunity</th><th>Date submitted</th><th>Status</th><th></th></tr></thead><tbody>${state.referrals.map(r=>`<tr><td><strong>${r.id}</strong></td><td>${esc(r.opportunity)}</td><td>${r.date}</td><td>${statusPill(r.status)}</td><td><button class="link" onclick="showReferral('${r.id}')">View</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">You have not submitted any referrals yet.</div>'}</div><p class="footer-note">For this shared demo, sample referrals are visible. A live service must show each person only their own referral records.</p>`}
function helpPage(){return `${pageHead('HELP & ACCESS','You can get help in person','The Navigator should not exclude anyone who cannot use a smartphone or read comfortably.')}<div class="grid two"><div class="panel"><h3>Ways to access support</h3><div class="detail-block"><h4>Municipal help point</h4><p>Ask a trained facilitator to help you find information or submit a referral. Confirm the operating location and hours with NJSMA.</p></div><div class="detail-block"><h4>Basic-phone access</h4><p>SMS access is planned. It is not connected in this prototype.</p></div><div class="detail-block"><h4>Language support</h4><p>English and Asante Twi are the proposed launch languages, subject to testing with fluent speakers.</p></div></div><div class="panel"><h3>Important information</h3><div class="notice" style="margin-top:12px">Never pay someone to access information through this demonstration. Do not share passwords, bank details or original identity documents here.</div><div class="detail-block"><h4>Need urgent or sensitive support?</h4><p>Use an appropriate municipal or specialist service directly. The demo assistant is not an emergency or safeguarding service.</p></div><button class="btn btn-secondary" onclick="setPage('assistant')">Ask a general question</button></div></div>`}
function statusPill(s){let c=s==='New'?'new':s==='Under review'?'review':(['Completed','Contacted','Enrolled'].includes(s)?'complete':s==='Declined'?'rejected':'');return `<span class="status ${c}">${esc(s)}</span>`}
function officerPage(){if(state.page==='overview')return officerOverview();if(state.page==='opportunities')return cataloguePage();if(state.page==='referrals')return referralAdminPage();if(state.page==='insights')return insightsPage();if(state.page==='accountability')return accountabilityPage();return settingsPage()}
function officerOverview(){let open=state.referrals.filter(r=>!['Completed','Declined'].includes(r.status)).length;return `${pageHead('MUNICIPAL WORKSPACE','Service delivery overview','Monitor opportunity information, referrals and departmental follow-up.',`<button class="btn btn-primary" onclick="setPage('opportunities')">＋ Manage catalogue</button>`)}<div class="grid stats">${stat('Young people reached','1,248','Illustrative demo metric','♙')}${stat('Active opportunities',state.opportunities.filter(o=>o.status==='Open').length,'In the sample catalogue','◇')}${stat('Referrals received',state.referrals.length,'Sample referral records','▤')}${stat('Awaiting action',open,'New or under review','◷')}</div><div class="grid two"><div class="panel"><div class="panel-head"><h3>Recent referrals</h3><button class="link" onclick="setPage('referrals')">View all →</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Young person</th><th>Opportunity</th><th>Status</th></tr></thead><tbody>${state.referrals.slice(0,4).map(r=>`<tr><td><strong>${esc(r.name)}</strong><div class="small muted">${r.id}</div></td><td>${esc(r.opportunity)}</td><td>${statusPill(r.status)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Catalogue health</h3><span class="pill">Sample data</span></div><div class="barrow"><span>Open listings</span><div class="bar"><span style="width:67%"></span></div><strong>${state.opportunities.filter(o=>o.status==='Open').length}</strong></div><div class="barrow"><span>Needs verification</span><div class="bar"><span style="width:33%;background:#d99a35"></span></div><strong>${state.opportunities.filter(o=>o.status!=='Open').length}</strong></div><div class="notice" style="margin-top:18px">A listing should not appear as an active opportunity until its owner confirms the details, criteria and review date.</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Department follow-up</h3><span class="small muted">Illustrative workload</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Department / team</th><th>Assigned referrals</th><th>Needs attention</th><th>Action</th></tr></thead><tbody><tr><td>Business Advisory Centre</td><td>2</td><td>1</td><td><button class="link" onclick="setPage('referrals')">Review referrals</button></td></tr><tr><td>Youth Services Desk</td><td>1</td><td>0</td><td><button class="link" onclick="setPage('referrals')">Review referrals</button></td></tr><tr><td>Social Welfare & Community Development</td><td>0</td><td>0</td><td><button class="link" onclick="setPage('opportunities')">Check catalogue</button></td></tr></tbody></table></div></div>`}
function cataloguePage(){return `${pageHead('SERVICE INFORMATION','Opportunity catalogue','Manage the information young people see. Each listing needs a named owner and review date.',`<button class="btn btn-primary" onclick="openOpportunityForm()">＋ Add opportunity</button>`)}<div class="toolbar"><input placeholder="Search catalogue…" id="catSearch" oninput="filterTable('catSearch','catalogueTable')"/><select id="catStatus" onchange="filterCatalogueStatus()"><option value="">All statuses</option><option>Open</option><option>Verification needed</option></select><span class="pill">${state.opportunities.length} records</span></div><div class="panel"><div class="table-wrap"><table class="table" id="catalogueTable"><thead><tr><th>Opportunity</th><th>Provider</th><th>Category</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.opportunities.map(o=>`<tr data-status="${esc(o.status)}"><td><strong>${esc(o.title)}</strong><div class="small muted">${o.id}</div></td><td>${esc(o.provider)}</td><td>${esc(o.category)}</td><td>${esc(o.deadline)}</td><td>${statusPill(o.status)}</td><td><button class="link" onclick="editOpportunity('${o.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div><p class="footer-note">Prototype controls are local to this browser session. A production system needs authenticated users, approval workflow and an immutable audit trail.</p>`}
function filterTable(inputId,tableId){let q=document.getElementById(inputId).value.toLowerCase();document.querySelectorAll('#'+tableId+' tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function filterCatalogueStatus(){let v=document.getElementById('catStatus').value;document.querySelectorAll('#catalogueTable tbody tr').forEach(tr=>tr.style.display=(!v||tr.dataset.status===v)?'':'none')}
function referralAdminPage(){return `${pageHead('CASE MANAGEMENT','Referral inbox','Review consented requests and record the next action.')}<div class="toolbar"><input id="refSearch" placeholder="Search by name, reference or opportunity…" oninput="filterTable('refSearch','refTable')"/><select id="refFilter" onchange="filterReferralStatus()"><option value="">All statuses</option>${['New','Under review','Contacted','Enrolled','Completed','Declined'].map(s=>`<option>${s}</option>`).join('')}</select><span class="pill">${state.referrals.length} referrals</span></div><div class="panel"><div class="table-wrap"><table class="table" id="refTable"><thead><tr><th>Young person</th><th>Opportunity</th><th>Department</th><th>Submitted</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.referrals.map(r=>`<tr data-status="${esc(r.status)}"><td><div class="person"><div class="initials">${r.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><strong>${esc(r.name)}</strong><div class="small muted">${r.id} · Age ${r.age}</div></div></div></td><td>${esc(r.opportunity)}</td><td>${esc(r.department)}</td><td>${r.date}</td><td>${statusPill(r.status)}</td><td><button class="link" onclick="showReferral('${r.id}')">Open case →</button></td></tr>`).join('')}</tbody></table></div></div><p class="footer-note">Only authorised officers should access identifiable referral details. This demonstration masks phone numbers and uses sample records.</p>`}
function filterReferralStatus(){let v=document.getElementById('refFilter').value;document.querySelectorAll('#refTable tbody tr').forEach(tr=>tr.style.display=(!v||tr.dataset.status===v)?'':'none')}
function insightsPage(){return `${pageHead('EVIDENCE & LEARNING','Youth insights','Understand what young people are looking for and where the service journey breaks down.')}<div class="grid stats">${stat('Most requested category','Skills','Illustrative category','◇')}${stat('Referral next-step rate','45%','Target in proposal, not achieved result','↗')}${stat('Young women reached','52%','Illustrative demo figure','♙')}${stat('Unmet demand signals','18','Illustrative count','⌁')}</div><div class="grid two"><div class="panel"><h3>Interest by opportunity area</h3><div class="barrow"><span>Skills training</span><div class="bar"><span style="width:82%"></span></div><strong>82</strong></div><div class="barrow"><span>Business support</span><div class="bar"><span style="width:61%"></span></div><strong>61</strong></div><div class="barrow"><span>Jobs</span><div class="bar"><span style="width:53%"></span></div><strong>53</strong></div><div class="barrow"><span>Apprenticeship</span><div class="bar"><span style="width:39%"></span></div><strong>39</strong></div><div class="small muted">Illustrative counts of expressed interest, not verified service take-up.</div></div><div class="panel"><h3>Access and inclusion</h3><div class="barrow"><span>Women</span><div class="bar"><span style="width:52%"></span></div><strong>52%</strong></div><div class="barrow"><span>Men</span><div class="bar"><span style="width:48%;background:#7294b4"></span></div><strong>48%</strong></div><div class="detail-block"><h4>Interpret with care</h4><p>Demographic reporting should use voluntary disclosure, protect small groups and avoid treating missing information as zero.</p></div></div></div><div class="notice" style="margin-top:16px">All figures on this screen are placeholders for demonstrating the dashboard. They are not project results and must not be used in grant reporting.</div>`}
function accountabilityPage(){return `${pageHead('PUBLIC ACCOUNTABILITY','Youth commitments','Track municipal actions linked to young people’s priorities.')}<div class="panel"><div class="panel-head"><h3>Commitment tracker</h3><span class="pill">Illustrative entries</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Commitment</th><th>Lead</th><th>Evidence to record</th><th>Status</th></tr></thead><tbody><tr><td>Maintain current information on youth programmes</td><td>Planning / service departments</td><td>Verified catalogue and review dates</td><td><span class="status review">To agree</span></td></tr><tr><td>Improve access to skills and enterprise support</td><td>Business Advisory Centre</td><td>Referral outcomes and service availability</td><td><span class="status review">To agree</span></td></tr><tr><td>Use youth needs evidence in planning</td><td>Municipal Planning Coordinating Unit</td><td>Quarterly needs report and recorded actions</td><td><span class="status review">To agree</span></td></tr></tbody></table></div></div><div class="panel" style="margin-top:16px"><h3>Quarterly accountability cycle</h3><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:16px"><div><div class="stat-icon">1</div><strong>Listen</strong><p class="small muted">Review anonymised questions and unmet demand.</p></div><div><div class="stat-icon">2</div><strong>Discuss</strong><p class="small muted">Take findings to youth forums and committees.</p></div><div><div class="stat-icon">3</div><strong>Agree</strong><p class="small muted">Record owners and actions with NJSMA.</p></div><div><div class="stat-icon">4</div><strong>Report</strong><p class="small muted">Publish progress without personal data.</p></div></div></div>`}
function settingsPage(){return `${pageHead('ADMINISTRATION','Settings & audit','Demonstration roles, access principles and governance controls.')}<div class="grid two"><div class="panel"><h3>Role model</h3><div class="detail-block"><h4>Catalogue steward</h4><p>Creates and reviews listings. Cannot access referral case details unless separately authorised.</p></div><div class="detail-block"><h4>Referral officer</h4><p>Views assigned referrals and records case actions.</p></div><div class="detail-block"><h4>Municipal leadership</h4><p>Views aggregated service performance and accountability information.</p></div><div class="detail-block"><h4>System administrator</h4><p>Manages user access and technical settings. Access is logged.</p></div></div><div class="panel"><h3>Production readiness checklist</h3>${['Data controller and processor roles agreed','Data Protection Commission requirements completed','Data protection impact assessment approved','Officer roles and permissions configured','Referral consent and privacy notice approved','Catalogue owners and review dates assigned','Security testing and audit logging completed','Retention and deletion schedule approved'].map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid var(--line);font-size:12px"><span class="pill" style="margin-right:7px">${i+1}</span>${x}</div>`).join('')}</div></div>`}
function executivePage(){return `${pageHead('EXECUTIVE VIEW','Municipal service performance','A high-level view of reach, access, referrals and delivery commitments.')}<div class="grid stats">${stat('Young people reached','1,248','Illustrative only','♙')}${stat('Referrals submitted',state.referrals.length,'Sample records','▤')}${stat('Confirmed next steps','1','Sample record, not project result','↗')}${stat('Listings needing review',state.opportunities.filter(o=>o.status!=='Open').length,'Catalogue governance','◷')}</div><div class="grid two"><div class="panel"><h3>Service delivery summary</h3><div class="barrow"><span>Skills access</span><div class="bar"><span style="width:72%"></span></div><strong>72%</strong></div><div class="barrow"><span>Enterprise support</span><div class="bar"><span style="width:55%"></span></div><strong>55%</strong></div><div class="barrow"><span>Employment routes</span><div class="bar"><span style="width:43%"></span></div><strong>43%</strong></div><p class="small muted">Illustrative index, not a measured outcome.</p></div><div class="panel"><h3>Leadership attention</h3><div class="detail-block"><h4>Catalogue verification</h4><p>Two listings need confirmation before they should be presented as available services.</p></div><div class="detail-block"><h4>Referral follow-up</h4><p>Review new and pending referrals against agreed departmental response times.</p></div><div class="detail-block"><h4>Demand intelligence</h4><p>Use recurring requests and unmet demand to inform youth service planning.</p></div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Privacy boundary</h3><span class="pill">Executive access</span></div><p class="muted" style="margin:0">This view is designed for aggregate reporting. It does not display names, phone numbers, referral notes or other identifiable personal information.</p></div><div class="notice" style="margin-top:16px">Demonstration data only. Replace all sample metrics with validated, consented and appropriately aggregated project data before operational use.</div>`}
function showOpportunity(id){const o=state.opportunities.find(x=>x.id===id);if(!o)return;state.selected=id;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><span class="pill">${esc(o.type)}</span><button class="close" onclick="closeModal()">×</button></div><div class="op-type">${esc(o.provider)}</div><h2 class="detail-title">${esc(o.title)}</h2><div class="op-meta"><span class="tag">${esc(o.location)}</span><span class="tag">${esc(o.status)}</span><span class="tag">Deadline: ${esc(o.deadline)}</span></div><div class="detail-block"><h4>About this opportunity</h4><p>${esc(o.description)}</p></div><div class="detail-block"><h4>Who may be eligible?</h4><p>${esc(o.eligibility)}</p></div><div class="detail-block"><h4>What you may need</h4><p>${esc(o.requirements)}</p></div><div class="detail-block"><h4>Responsible contact</h4><p>${esc(o.contact)}</p></div><div class="notice" style="margin:14px 0">${o.status==='Open'?'This is a demonstration listing. Confirm availability and requirements with the provider.':'This listing needs verification. You can request an information enquiry, but do not treat it as an open intake.'}</div><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="openReferralForm('${o.id}')">Request information / referral</button></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openReferralForm(id){const o=state.opportunities.find(x=>x.id===id);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Request a referral</h2><button class="close" onclick="closeModal()">×</button></div><p class="small muted">Opportunity: <strong>${esc(o.title)}</strong></p><div class="notice" style="margin-bottom:15px">Only provide information needed for this enquiry. An officer will review the request. Submitting this form does not guarantee selection or funding.</div><form onsubmit="submitReferral(event,'${o.id}')"><div class="form-grid"><div class="field"><label>FULL NAME</label><input name="name" required maxlength="80" placeholder="Your name"/></div><div class="field"><label>AGE</label><input name="age" type="number" min="18" max="35" required placeholder="18–35"/></div><div class="field"><label>PHONE NUMBER</label><input name="phone" required pattern="[0-9+ ]{9,16}" placeholder="e.g. 024 000 0000"/></div><div class="field"><label>AREA / COMMUNITY</label><input name="area" required placeholder="e.g. Adweso"/></div><div class="field span2"><label>WHAT HELP DO YOU NEED? (OPTIONAL)</label><textarea name="note" maxlength="500" placeholder="Briefly describe what you would like help with"></textarea></div></div><label style="display:flex;gap:9px;align-items:flex-start;font-size:12px;margin:10px 0 16px"><input type="checkbox" required style="margin-top:3px"/> I agree that my details can be shared with the responsible service team to respond to this request. I understand this is a demonstration and not a live government application.</label><button class="btn btn-primary" style="width:100%;justify-content:center">Submit referral</button></form></div></div>`}
function submitReferral(e,id){e.preventDefault();const f=new FormData(e.target),o=state.opportunities.find(x=>x.id===id);let ref={id:'YSN-'+String(25+state.referrals.length).padStart(4,'0'),name:f.get('name'),age:f.get('age'),phone:'*** masked ***',area:f.get('area'),opportunity:o.title,department:o.contact,date:'26 Nov 2026',status:'New',note:f.get('note')||'No additional note'};state.referrals.unshift(ref);closeModal();state.role='youth';state.page='referrals';document.getElementById('roleSwitch').value='youth';render();toast('Referral submitted. Reference: '+ref.id)}
function showReferral(id){const r=state.referrals.find(x=>x.id===id);if(!r)return;let canEdit=state.role!=='youth';document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Referral ${r.id}</h2><button class="close" onclick="closeModal()">×</button></div><div class="person" style="margin-bottom:14px"><div class="initials">${r.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><strong>${esc(r.name)}</strong><div class="small muted">Age ${r.age} · ${esc(r.phone)}</div></div></div><div class="detail-block"><h4>Opportunity</h4><p>${esc(r.opportunity)}</p></div><div class="detail-block"><h4>Responsible team</h4><p>${esc(r.department)}</p></div><div class="detail-block"><h4>Submitted</h4><p>${r.date}</p></div><div class="detail-block"><h4>Request note</h4><p>${esc(r.note)}</p></div><div class="detail-block"><h4>Current status</h4>${statusPill(r.status)}</div>${canEdit?`<div class="field" style="margin-top:16px"><label>UPDATE STATUS</label><select id="newStatus">${['New','Under review','Contacted','Enrolled','Completed','Declined'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>OFFICER NOTE (DEMO)</label><textarea id="officerNote" placeholder="Record action taken or next step"></textarea></div><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="updateReferral('${r.id}')">Save update</button>`:`<div class="notice" style="margin-top:14px">Your information is shared with the responsible team only for this referral in a live service. This prototype uses shared demonstration data.</div>`}</div></div>`}
function updateReferral(id){let r=state.referrals.find(x=>x.id===id);r.status=document.getElementById('newStatus').value;let note=document.getElementById('officerNote').value;if(note)r.note+=' | Officer update: '+note;closeModal();render();toast('Referral status updated')}
function openOpportunityForm(id){let o=id?state.opportunities.find(x=>x.id===id):null;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${o?'Edit opportunity':'Add opportunity'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveOpportunity(event,'${o?o.id:''}')"><div class="field"><label>OPPORTUNITY TITLE</label><input name="title" required value="${esc(o?.title||'')}"/></div><div class="form-grid"><div class="field"><label>TYPE</label><select name="type">${['Skills training','Employment support','Apprenticeship','Enterprise support','Business support','Inclusion'].map(x=>`<option ${o?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>CATEGORY</label><select name="category">${['Skills','Jobs','Business','Apprenticeship','Inclusion'].map(x=>`<option ${o?.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>PROVIDER</label><input name="provider" required value="${esc(o?.provider||'NJSMA department')}"/></div><div class="field"><label>LOCATION</label><input name="location" required value="${esc(o?.location||'Koforidua')}"/></div><div class="field"><label>DEADLINE / INTAKE</label><input name="deadline" value="${esc(o?.deadline||'To be confirmed')}"/></div><div class="field"><label>STATUS</label><select name="status"><option ${o?.status==='Open'?'selected':''}>Open</option><option ${o?.status==='Verification needed'?'selected':''}>Verification needed</option></select></div></div><div class="field"><label>DESCRIPTION</label><textarea name="description" required>${esc(o?.description||'')}</textarea></div><div class="field"><label>ELIGIBILITY INFORMATION</label><textarea name="eligibility">${esc(o?.eligibility||'To be confirmed by the provider.')}</textarea></div><div class="field"><label>REQUIREMENTS / NEXT STEPS</label><textarea name="requirements">${esc(o?.requirements||'Confirm with the provider.')}</textarea></div><div class="field"><label>RESPONSIBLE CONTACT / DEPARTMENT</label><input name="contact" value="${esc(o?.contact||'NJSMA service desk')}"/></div><button class="btn btn-primary" style="width:100%;justify-content:center">Save listing</button></form></div></div>`}
function editOpportunity(id){openOpportunityForm(id)}
function saveOpportunity(e,id){e.preventDefault();let f=new FormData(e.target);let data={title:f.get('title'),type:f.get('type'),category:f.get('category'),provider:f.get('provider'),location:f.get('location'),deadline:f.get('deadline'),status:f.get('status'),description:f.get('description'),eligibility:f.get('eligibility'),requirements:f.get('requirements'),contact:f.get('contact'),demo:true};if(id){Object.assign(state.opportunities.find(x=>x.id===id),data)}else{data.id='OP-'+String(state.opportunities.length+1).padStart(3,'0');state.opportunities.unshift(data)}closeModal();render();toast('Opportunity listing saved')}
render();
document.getElementById('roleSwitch').addEventListener('change',e=>setRole(e.target.value));
</script>
</body>
</html>
